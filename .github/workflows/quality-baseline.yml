name: quality-baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality baseline
        run: pnpm check

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-baseline
          path: docs/baselines/*.json
          if-no-files-found: ignore
